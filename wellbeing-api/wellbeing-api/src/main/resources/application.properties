spring.application.name=student-wellbeing-system-api
server.port=8080

# Same database as your JSF/Hibernate version's hibernate.cfg.xml.
# Postgres does not auto-create the DB - create it once yourself first:
#   CREATE DATABASE wellbeing_db;
spring.datasource.url=jdbc:postgresql://localhost:5432/wellbeing_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- No Postgres installed? Comment the Postgres block above and uncomment this
# --- H2 in-memory block instead for quick Postman testing (data resets on restart).
# spring.datasource.url=jdbc:h2:mem:wellbeing
# spring.datasource.driver-class-name=org.h2.Driver
